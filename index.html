<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>DCMI 2026 운영 보드</title>
<style>
  :root{
    --bg:#F7F8FA; --surface:#FFFFFF; --surface2:#FBFCFD;
    --ink:#16202C; --muted:#5B6675; --faint:#8A94A3;
    --line:#E4E8EE; --line2:#EEF1F5;
    --primary:#1F4E6B; --primary-soft:#E9F0F5;
    --accent:#E4572E; --accent-soft:#FCEDE8;
    --ok:#2E7D5B; --ok-soft:#E7F3EC;
    --warn:#B8860B; --warn-soft:#FBF3DE;
    --shadow:0 1px 2px rgba(16,32,44,.05),0 4px 16px rgba(16,32,44,.05);
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;}
  body{padding-bottom:88px; max-width:680px; margin:0 auto;}
  a{color:inherit;}
  button{font-family:inherit;}

  header{position:sticky; top:0; z-index:30; background:rgba(247,248,250,.92);
    backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;}
  .brand{display:flex; align-items:baseline; gap:9px;}
  .brand b{font-size:15px; letter-spacing:-.3px;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent); display:inline-block; transform:translateY(-1px);}
  .brand small{color:var(--faint); font-size:11.5px; margin-left:auto; font-variant-numeric:tabular-nums;}

  nav.tabs{display:flex; gap:6px; overflow-x:auto; padding:10px 12px 4px; scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); padding:8px 14px; border-radius:999px; font-size:13.5px;
    font-weight:600; cursor:pointer; white-space:nowrap; transition:.15s;}
  .tab[aria-selected="true"]{background:var(--ink); color:#fff; border-color:var(--ink);}
  .tab:focus-visible,.bb:focus-visible,.box:focus-visible,.daybtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  main{padding:6px 14px 20px;}
  section[hidden]{display:none;}
  h2.view-h{font-size:20px; letter-spacing:-.4px; margin:14px 2px 6px;}
  .sub{color:var(--muted); font-size:13px; margin:0 2px 14px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; margin-bottom:14px;}
  .card h3{margin:0 0 3px; font-size:15px; letter-spacing:-.2px;}
  .card .eyebrow{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--primary); margin-bottom:8px;}

  .hero{background:linear-gradient(135deg,#173A50,#1F4E6B); color:#fff; border:none;}
  .hero .eyebrow{color:#A8C6D8;}
  .hero .dday{display:flex; align-items:flex-end; gap:12px; margin:2px 0 10px;}
  .hero .dnum{font-size:52px; font-weight:800; letter-spacing:-2px; line-height:.9; font-variant-numeric:tabular-nums;}
  .hero .dlabel{font-size:14px; color:#CFE0EB; padding-bottom:7px;}
  .hero .meta{font-size:13px; color:#DCE8F0; border-top:1px solid rgba(255,255,255,.16); padding-top:10px;}

  .chk{display:flex; gap:12px; align-items:flex-start; padding:12px 2px; border-top:1px solid var(--line2);}
  .chk:first-of-type{border-top:none;}
  .box{flex:0 0 auto; width:24px; height:24px; border-radius:7px; border:2px solid #C7CFDA;
    background:#fff; cursor:pointer; display:grid; place-items:center; margin-top:1px; transition:.12s;}
  .box svg{width:14px;height:14px; opacity:0; transition:.12s;}
  .box[aria-checked="true"]{background:var(--ok); border-color:var(--ok);}
  .box[aria-checked="true"] svg{opacity:1;}
  .chk .body{flex:1; min-width:0;}
  .chk .lab{font-size:14.5px; font-weight:600; letter-spacing:-.1px;}
  .chk[data-done="true"] .lab{color:var(--faint); text-decoration:line-through;}
  .chk .metaline{font-size:12px; color:var(--muted); margin-top:3px; display:flex; flex-wrap:wrap; gap:6px 10px;}
  .pill{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap;}
  .pill.due{background:var(--accent-soft); color:#B5401E;}
  .pill.done{background:var(--ok-soft); color:var(--ok);}
  .pill.vendor{background:var(--primary-soft); color:var(--primary);}
  .pill.warn{background:var(--warn-soft); color:#8A6608;}
  .chk .del{flex:0 0 auto; border:none; background:none; color:#C2C9D3; font-size:20px; cursor:pointer; padding:0 2px; line-height:1;}

  .catrow{display:flex; align-items:center; justify-content:space-between; margin:22px 2px 4px;}
  .catrow h3{font-size:16px; margin:0; letter-spacing:-.2px;}
  .catrow .count{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .progress{height:6px; background:var(--line2); border-radius:999px; overflow:hidden; margin:8px 2px 12px;}
  .progress i{display:block; height:100%; background:var(--ok); border-radius:999px; transition:width .3s;}

  .addbtn{width:100%; border:1.5px dashed var(--line); background:var(--surface2); color:var(--muted);
    padding:12px; border-radius:12px; font-size:13.5px; font-weight:600; cursor:pointer; margin-top:4px;}

  .daypick{display:flex; gap:7px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none;}
  .daypick::-webkit-scrollbar{display:none;}
  .daybtn{flex:0 0 auto; min-width:58px; text-align:center; border:1px solid var(--line);
    background:var(--surface); border-radius:12px; padding:9px 4px; cursor:pointer;}
  .daybtn .d{font-size:16px; font-weight:800; letter-spacing:-.5px;}
  .daybtn .w{font-size:11px; color:var(--muted); margin-top:1px;}
  .daybtn[aria-selected="true"]{background:var(--primary); border-color:var(--primary); color:#fff;}
  .daybtn[aria-selected="true"] .w{color:#CFE0EB;}
  .daybtn[data-today="true"]::after{content:"오늘"; display:block; font-size:9px; font-weight:800; color:var(--accent); margin-top:2px;}
  .daybtn[aria-selected="true"][data-today="true"]::after{color:#FFD9CC;}

  .timerow{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--line2); font-size:13.5px;}
  .timerow:first-child{border-top:none;}
  .timerow .t{flex:0 0 92px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--primary);}
  .timerow .v{flex:1;}

  .assign{border-top:1px solid var(--line2); padding:11px 0;}
  .assign:first-child{border-top:none;}
  .assign .z{font-size:12px; font-weight:800; color:var(--muted);}
  .assign .p{font-size:14px; margin-top:2px;}

  .sess{padding:9px 0; border-top:1px solid var(--line2); font-size:13.5px; display:flex; gap:9px;}
  .sess:first-child{border-top:none;}
  .sess .st{flex:0 0 52px; font-weight:700; color:var(--primary); font-variant-numeric:tabular-nums; font-size:12.5px;}
  .sess .sv{flex:1;}
  .sess .tag{display:inline-block; font-size:10px; font-weight:800; padding:1px 6px; border-radius:5px; margin-right:5px; vertical-align:1px;}
  .tag.vip{background:#F3E8FF; color:#7B3FA0;}
  .tag.bf{background:var(--primary-soft); color:var(--primary);}
  .tag.nlk{background:var(--accent-soft); color:#B5401E;}
  .tag.loc{background:var(--line2); color:var(--muted);}

  .note{background:var(--warn-soft); border:1px solid #EBD9A6; border-radius:12px; padding:12px 13px;
    font-size:13px; color:#6B5205; margin-bottom:12px;}
  .note b{color:#5A4404;}
  .info{background:var(--primary-soft); border:1px solid #CBDDE9; border-radius:12px; padding:11px 13px;
    font-size:12.5px; color:#1B4258; margin-bottom:12px;}

  .search{width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-size:15px; margin-bottom:14px; background:var(--surface);}
  .search:focus{outline:none; border-color:var(--primary);}
  .cgroup{font-size:12px; font-weight:800; color:var(--faint); letter-spacing:.05em; margin:18px 4px 6px;}
  .contact{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:11px 13px; margin-bottom:8px;}
  .contact .ci{flex:1; min-width:0;}
  .contact .nm{font-size:14.5px; font-weight:600;}
  .contact .rl{font-size:12px; color:var(--muted); margin-top:1px;}
  .contact .call{flex:0 0 auto; width:42px; height:42px; border-radius:50%; background:var(--ok-soft);
    display:grid; place-items:center; text-decoration:none;}
  .contact .call svg{width:19px;height:19px;fill:var(--ok);}
  .contact .call.none{background:var(--line2);}
  .contact .call.none svg{fill:var(--faint);}

  .loccard .row{display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line2); font-size:13.5px;}
  .loccard .row:first-of-type{border-top:none;}
  .loccard .row .k{color:var(--muted); flex:0 0 88px;}
  .loccard .row .v{flex:1; text-align:right;}

  .foot{text-align:center; color:var(--faint); font-size:11.5px; padding:16px 0 4px; line-height:1.7;}

  .bottombar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(255,255,255,.95);
    backdrop-filter:blur(12px); border-top:1px solid var(--line);
    display:flex; padding:6px 6px calc(env(safe-area-inset-bottom) + 6px); max-width:680px; margin:0 auto;}
  .bb{flex:1; border:none; background:none; padding:6px 2px; cursor:pointer; display:flex;
    flex-direction:column; align-items:center; gap:3px; color:var(--faint); font-size:10.5px; font-weight:700;}
  .bb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;}
  .bb[aria-selected="true"]{color:var(--accent);}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

/* =========================================================
   [저장] 체크 상태를 이 브라우저에 저장합니다.
   사람마다 각자 기기에 저장되며 서로 공유되지 않습니다.
   ========================================================= */
var KEY="dcmi2026_v1";
var STATE={checks:{},hidden:[],custom:[]};
var memFallback={};
function loadState(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var o=JSON.parse(raw); STATE.checks=o.checks||{}; STATE.hidden=o.hidden||[]; STATE.custom=o.custom||[]; }
  }catch(e){
    try{ if(memFallback[KEY]){ var o2=JSON.parse(memFallback[KEY]); STATE.checks=o2.checks||{}; STATE.hidden=o2.hidden||[]; STATE.custom=o2.custom||[]; } }catch(_){}
  }
}
var saveT;
function saveState(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    var s=JSON.stringify(STATE);
    try{ localStorage.setItem(KEY,s); }catch(e){ memFallback[KEY]=s; }
  },150);
}
function resetState(){
  if(!confirm("이 기기에 저장된 모든 체크와 추가 항목을 지웁니다. 계속할까요?")) return;
  STATE={checks:{},hidden:[],custom:[]};
  try{ localStorage.removeItem(KEY); }catch(e){ memFallback={}; }
  renderAll();
}

function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function isHidden(id){return STATE.hidden.indexOf(id)>=0;}
function isDone(id){return !!STATE.checks[id];}
function toggle(id){ STATE.checks[id]=!STATE.checks[id]; saveState(); renderAll(); }
function hide(id){ if(STATE.hidden.indexOf(id)<0) STATE.hidden.push(id); saveState(); renderAll(); }
function unhide(id){ STATE.hidden=STATE.hidden.filter(function(x){return x!==id;}); saveState(); renderAll(); }
function lookupLabel(id){
  for(var cat in PREP){ var m=PREP[cat].filter(function(it){return it.id===id;}); if(m.length) return m[0].lab; }
  var t=TODO.filter(function(it){return it.id===id;}); if(t.length) return t[0].lab;
  var c=STATE.custom.filter(function(it){return it.id===id;}); if(c.length) return c[0].lab;
  if(id.indexOf("open_")===0 || id.indexOf("close_")===0){
    var isOpen=id.indexOf("open_")===0;
    var rest=id.slice(isOpen?5:6);
    var parts=rest.split("_");
    var idx=parseInt(parts.pop(),10);
    var date=parts.join(".");
    var arr=isOpen?DAILY_OPEN:DAILY_CLOSE;
    return (isOpen?"개문 · ":"폐문 · ")+date+" · "+(arr[idx]||"");
  }
  return id;
}

function chkItem(it){
  if(isHidden(it.id)) return "";
  if(it.done && STATE.checks[it.id]===undefined) STATE.checks[it.id]=true;
  var done=isDone(it.id);
  var pills=[];
  if(it.due) pills.push('<span class="pill '+(done?'done':'due')+'">'+it.due+'</span>');
  if(it.vendor) pills.push('<span class="pill vendor">'+it.vendor+'</span>');
  if(it.warn) pills.push('<span class="pill warn">⚠ '+it.warn+'</span>');
  return '<div class="chk" data-done="'+done+'">'+
    '<div class="box" role="checkbox" aria-checked="'+done+'" tabindex="0" aria-label="'+esc(it.lab)+'" '+
    'onclick="toggle(\''+it.id+'\')" onkeydown="if(event.key===\' \'||event.key===\'Enter\'){event.preventDefault();toggle(\''+it.id+'\')}">'+IC.check+'</div>'+
    '<div class="body"><div class="lab">'+it.lab+'</div>'+(pills.length?'<div class="metaline">'+pills.join("")+'</div>':'')+'</div>'+
    '<button class="del" title="숨기기" aria-label="항목 숨기기" onclick="hide(\''+it.id+'\')">×</button></div>';
}

    D.assign.map(function(a){return '<div class="assign"><div class="z">'+a[0]+'</div><div class="p">'+a[1]+'</div></div>';}).join("")+'</div>';
  h+='<div class="card"><div class="eyebrow">세션 하이라이트</div>'+
    D.sess.map(function(s){return '<div class="sess"><div class="st">'+s[0]+'</div><div class="sv">'+s[1]+'</div></div>';}).join("")+'</div>';

  var dk=D.date.replace(".","_");
  h+='<div class="card"><div class="eyebrow">개문 · 07:00~09:00</div>'+
    DAILY_OPEN.map(function(x,i){return chkItem({id:"open_"+dk+"_"+i,lab:x});}).join("")+'</div>';
  h+='<div class="card"><div class="eyebrow">폐문 · 종료 후</div>'+
    DAILY_CLOSE.map(function(x,i){return chkItem({id:"close_"+dk+"_"+i,lab:x});}).join("")+'</div>';
  $("#view-day").innerHTML=h;
}

function renderPrep(){
  var h='<h2 class="view-h">준비물 체크리스트</h2><p class="sub">체크 · 숨기기(×) · 추가가 가능합니다. 이 기기에만 저장됩니다.</p>'+
    '<a href="https://docs.google.com/spreadsheets/d/1N_L_AVbyyiewJ9ZUD4aJsfH_bGrDt2XGfEz5dHrlKHI/edit" target="_blank" rel="noopener" '+
    'style="display:block;text-decoration:none;background:var(--primary);color:#fff;border-radius:12px;padding:13px 16px;margin-bottom:16px;font-weight:700;font-size:13.5px;text-align:center;box-shadow:var(--shadow)">'+
    '📋 구글시트에서 실시간 확인·체크하기</a>'+
    '<div class="info">아래 목록은 <b>참고용(각자 기기에만 저장)</b>입니다. 팀 전체가 같이 보는 진행 상황은 위 버튼의 구글시트를 이용하세요.</div>';
  for(var cat in PREP){
    var vis=PREP[cat].filter(function(it){return !isHidden(it.id);});
    var d=vis.filter(function(it){return isDone(it.id)||(it.done&&STATE.checks[it.id]===undefined);}).length;
    h+='<div class="catrow"><h3>'+cat+'</h3><span class="count">'+d+'/'+vis.length+'</span></div>'+
      '<div class="progress"><i style="width:'+(vis.length?Math.round(d/vis.length*100):0)+'%"></i></div>'+
      '<div class="card">'+(vis.map(chkItem).join("")||'<div class="sub" style="margin:4px 2px">항목 없음</div>')+'</div>';
  }
  var tv=TODO.filter(function(it){return !isHidden(it.id);});
  h+='<div class="catrow"><h3>확인 · 미정 사항</h3><span class="count">'+tv.filter(function(it){return isDone(it.id);}).length+'/'+tv.length+'</span></div>'+
     '<div class="card">'+(tv.map(chkItem).join("")||'<div class="sub" style="margin:4px 2px">모두 처리됨</div>')+'</div>';
  var cv=STATE.custom.filter(function(it){return !isHidden(it.id);});
  h+='<div class="catrow"><h3>직접 추가</h3><span class="count">'+cv.filter(function(it){return isDone(it.id);}).length+'/'+cv.length+'</span></div>'+
     '<div class="card">'+cv.map(chkItem).join("")+'<button class="addbtn" onclick="addItem()">+ 항목 추가</button></div>';
  if(STATE.hidden.length){
    h+='<div class="catrow"><h3>숨긴 항목</h3><span class="count">'+STATE.hidden.length+'건</span></div><div class="card">'+
      STATE.hidden.map(function(id){
        return '<div class="chk"><div class="body"><div class="lab" style="color:var(--faint);text-decoration:none">'+lookupLabel(id)+'</div></div>'+
          '<button class="addbtn" style="width:auto;padding:6px 12px;margin:0;flex:0 0 auto" onclick="unhide(\''+id+'\')">다시 보이기</button></div>';
      }).join("")+'</div>';
  }
  h+='<div style="text-align:center;padding:6px 0 10px"><button class="addbtn" style="width:auto;padding:9px 18px;border-style:solid" onclick="resetState()">체크 전체 초기화</button></div>';
  $("#view-prep").innerHTML=h;
}
function addItem(){
  var v=prompt("추가할 준비 항목을 입력하세요");
  if(v&&v.trim()){ STATE.custom.push({id:"c"+Date.now(),lab:esc(v.trim())}); saveState(); renderAll(); }
}

function renderPlace(){
  var h='<h2 class="view-h">장소별 안내</h2><p class="sub">회의장 · 견학 · 로비별 좌석, 장비, 담당 업무.</p>';
  h+=PLACES.map(function(P){
    return '<div class="card loccard"><h3>'+P.n+'</h3>'+
      '<div class="metaline" style="margin:2px 0 6px"><span class="pill vendor">'+P.tag+'</span></div>'+
      P.rows.map(function(r){return '<div class="row"><div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div></div>';}).join("")+
      (P.extra?'<div class="note" style="margin:12px 0 0">'+P.extra+'</div>':'')+'</div>';}).join("");
  $("#view-place").innerHTML=h;
}

function renderContact(f){
  f=f||""; var q=f.trim().toLowerCase();
  var h='<h2 class="view-h">연락처</h2>'+
    '<div class="info">공개 페이지이므로 <b>사무실 유선번호</b>만 수록했습니다. 휴대폰 번호는 운영 단톡방을 확인하세요.</div>'+
    '<input class="search" placeholder="이름 · 부서 · 역할 검색" value="'+esc(f)+'" oninput="renderContact(this.value)" autocomplete="off">';
  CONTACTS.forEach(function(G){
    var list=G.list.filter(function(c){return !q || (c[0]+c[1]+G.g).toLowerCase().indexOf(q)>=0;});
    if(!list.length) return;
    h+='<div class="cgroup">'+G.g+'</div>';
    list.forEach(function(c){
      var has=/\d/.test(c[2]);
      h+='<div class="contact"><div class="ci"><div class="nm">'+c[0]+
        (c[1]?' · <span style="color:var(--muted);font-weight:500">'+c[1]+'</span>':'')+'</div>'+
        '<div class="rl">'+c[2]+'</div></div>'+
        (has?'<a class="call" href="tel:'+c[2].replace(/-/g,"")+'" aria-label="전화 걸기">'+IC.phone+'</a>'
           :'<span class="call none">'+IC.phone+'</span>')+'</div>';
    });
  });
  $("#view-contact").innerHTML=h;
  var inp=$("#view-contact .search"); if(inp&&f){ inp.focus(); inp.setSelectionRange(f.length,f.length); }
}

function renderVip(){
  var h='<h2 class="view-h">의전 · VIP</h2><p class="sub">부장님 일정, 주요 인사, 숙박.</p>';
  h+='<div class="card"><div class="eyebrow">주요 인사</div>'+
    '<div class="assign"><div class="z">오삼균 교수 (DCMI)</div><div class="p">전 기간 참여</div></div>'+
    '<div class="assign"><div class="z">맹성현 교수 (KAIST)</div><div class="p">오프닝(8.4)만 참여</div></div></div>';
  VIP_SCHED.forEach(function(S){
    h+='<div class="card"><div class="eyebrow">박주옥 부장님 · '+S.d+'</div>'+
      S.items.map(function(i){return '<div class="sess"><div class="st">'+i[0]+'</div><div class="sv">'+i[1]+'</div></div>';}).join("")+'</div>';
  });
  h+='<div class="card"><div class="eyebrow">숙박 · 노보텔 앰배서더 강남</div>'+
    VIP_STAY.map(function(v){return '<div class="assign"><div class="p"><b>'+v[0]+'</b> · '+v[1]+'</div>'+
      '<div class="z" style="margin-top:2px">'+v[2]+' · '+v[3]+'</div></div>';}).join("")+'</div>';
  $("#view-vip").innerHTML=h;
}

var VIEWS=[
  {id:"today",label:"오늘",icon:IC.today,render:renderToday},
  {id:"day",label:"일정",icon:IC.cal,render:renderDay},
  {id:"prep",label:"준비물",icon:IC.list,render:renderPrep},
  {id:"place",label:"장소",icon:IC.pin,render:renderPlace},
  {id:"contact",label:"연락처",icon:IC.phoneO,render:function(){renderContact("");}},
  {id:"vip",label:"의전",icon:IC.star.replace('viewBox','fill="none" stroke="currentColor" stroke-width="1.9" viewBox'),render:renderVip}
];
var cur="today";
function show(id){
  cur=id;
  VIEWS.forEach(function(v){ $("#view-"+v.id).hidden=(v.id!==id); });
  Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"),function(t){t.setAttribute("aria-selected",t.dataset.v===id);});
  Array.prototype.forEach.call(document.querySelectorAll("#bottombar .bb"),function(b){b.setAttribute("aria-selected",b.dataset.v===id);});
  var v=VIEWS.filter(function(x){return x.id===id;})[0]; if(v) v.render();
  window.scrollTo(0,0);
}
function renderAll(){ var v=VIEWS.filter(function(x){return x.id===cur;})[0]; if(v) v.render(); }
function buildNav(){
  $("#tabs").innerHTML=VIEWS.map(function(v){return '<button class="tab" role="tab" data-v="'+v.id+'" onclick="show(\''+v.id+'\')">'+v.label+'</button>';}).join("");
  $("#bottombar").innerHTML=VIEWS.map(function(v){return '<button class="bb" data-v="'+v.id+'" onclick="show(\''+v.id+'\')">'+v.icon+'<span>'+v.label+'</span></button>';}).join("");
}
function tick(){
  var n=new Date(), wd=["일","월","화","수","목","금","토"][n.getDay()];
  $("#clock").textContent=(n.getMonth()+1)+"."+n.getDate()+"("+wd+") "+
    String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
}
loadState(); buildNav(); tick(); setInterval(tick,30000); show("today");
</script>
</body>
</html>
